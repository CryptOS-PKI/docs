name: Build
# Builds the Docusaurus site so a broken build fails at PR time, not on deploy.
# The theme comes from public npm, so no registry token is needed here.
#
# Pull requests only, and not while the PR is a draft. There is no run on push
# to main: nothing deploys from this workflow, and the squash merge lands the
# tree the PR run already built.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
# One run per PR per workflow: a new push cancels the older PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: 🏗️ Build site
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
