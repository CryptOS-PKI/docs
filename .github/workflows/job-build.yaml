name: Build
# Builds the Docusaurus site so a broken build fails at PR time, not on deploy.
# The theme comes from public npm, so no registry token is needed here.
#
# Pull requests only, and not while the PR is a draft. There is no run on push
# to main: nothing deploys from this workflow, and the squash merge lands the
# tree the PR run already built.
on:
  pull_request:
    branches: [main]
    # edited is here so retargeting a stacked PR onto main starts CI. Jobs
    # skip edited events that did not change the base (title/body edits), and
    # a skipped job is not billed.
    types: [opened, synchronize, reopened, ready_for_review, edited]
# One run per PR per workflow: a new push cancels the older PR run. A title or
# body edit gets its own group, so its run never cancels real CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.base == null && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: 🏗️ Build site
    if: github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
